x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cyber-backup-api}
    ports:
      # PostgreSQL and MinIO stay on loopback even when the API and frontend are public.
      - "${DEV_INTERNAL_BIND_IP:-127.0.0.1}:${DEV_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 30s
      start_interval: 5s
      start_period: 60s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    logging: *default-logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${DEV_INTERNAL_BIND_IP:-127.0.0.1}:${DEV_MINIO_API_PORT:-9000}:9000"
      - "${DEV_INTERNAL_BIND_IP:-127.0.0.1}:${DEV_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 30s
      start_interval: 5s
      start_period: 60s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: backend/Apps/CyberBackup/Api/Dockerfile
      args:
        BUILD_CONFIGURATION: ${BUILD_CONFIGURATION:-Debug}
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${DEV_BIND_IP:-127.0.0.1}:${DEV_BACKEND_PORT:-5000}:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Development
    
      - PostgresOptions__ConnectionString=Host=postgres;Port=5432;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres};Database=${POSTGRES_DB:-cyber-backup-api};Pooling=true;Minimum Pool Size=0;Maximum Pool Size=100;
      - PostgresOptions__AutoMigration=true
    
      - CyberCorsOptions__Origins__0=${DEV_FRONTEND_ORIGIN:-http://localhost:${DEV_FRONTEND_PORT:-5173}}
    
      - JwtOptions__Issuer=solution
      - JwtOptions__Audience=auth-api
      - JwtOptions__SigningKey=${JWT_SIGNING_KEY:-local-dev-signing-key-change-me-please-32-bytes-minimum}
      - JwtOptions__AccessTokenLifetimeMinutes=15
    
      - RefreshTokenOptions__LifetimeDays=7
      - RefreshTokenOptions__TokenBytes=64
    
      - AuthTokenOptions__ClientId=web-client
      - AuthTokenOptions__Scopes__0=identity
    
      - PasswordHashOptions__Pepper=${PASSWORD_HASH_PEPPER:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      - PasswordHashOptions__WorkFactor=12
    
      - SuperAdminOptions__Email=${SUPERADMIN_EMAIL:-superadmin@example.com}
      - SuperAdminOptions__Password=${SUPERADMIN_PASSWORD:-admin123}
      - SuperAdminOptions__FullName=${SUPERADMIN_FULL_NAME:-Суперадминистратор}

      - MinioOptions__Endpoint=minio:9000
      - MinioOptions__AccessKey=${MINIO_ROOT_USER:-minioadmin}
      - MinioOptions__SecretKey=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MinioOptions__BucketName=${MINIO_BUCKET_NAME:-cyberbackup}
      - MinioOptions__UseSsl=false
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      target: dev
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${DEV_BIND_IP:-127.0.0.1}:${DEV_FRONTEND_PORT:-5173}:5173"
    volumes:
      - ../frontend/src:/app/src
      - ../frontend/public:/app/public
      - ../frontend/index.html:/app/index.html
      - ../frontend/vite.config.ts:/app/vite.config.ts
      - ../frontend/tsconfig.json:/app/tsconfig.json
      - ../frontend/tsconfig.app.json:/app/tsconfig.app.json
      - ../frontend/tsconfig.node.json:/app/tsconfig.node.json
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_BASE_URL=${DEV_API_BASE_URL:-http://localhost:${DEV_BACKEND_PORT:-5000}}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      start_interval: 5s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
