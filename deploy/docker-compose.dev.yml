services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    ports:
      # PostgreSQL and MinIO stay on loopback even when the API and frontend are public.
      - "${DEV_INTERNAL_BIND_IP:-127.0.0.1}:${DEV_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER" ]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: chainguard/minio:latest
    restart: unless-stopped
    user: root
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${DEV_INTERNAL_BIND_IP:-127.0.0.1}:${DEV_MINIO_API_PORT:-9000}:9000"
      - "${DEV_INTERNAL_BIND_IP:-127.0.0.1}:${DEV_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: backend/Apps/CyberBackup/Api/Dockerfile
    restart: unless-stopped
    ports:
      - "${DEV_BIND_IP:-0.0.0.0}:${DEV_BACKEND_PORT:-5000}:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Development

      - PostgresOptions__ConnectionString=Host=postgres;Port=5432;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres};Database=${POSTGRES_DB:-cyber-backup-api};Pooling=true;Minimum Pool Size=0;Maximum Pool Size=100;
      - PostgresOptions__AutoMigration=true

      - CyberCorsOptions__Origins__0=${DEV_FRONTEND_ORIGIN:-http://localhost:${DEV_FRONTEND_PORT:-5173}}

      - JwtOptions__Issuer=solution
      - JwtOptions__Audience=auth-api
      - JwtOptions__SigningKey=${JWT_SIGNING_KEY:-local-dev-signing-key-change-me-please-32-bytes-minimum}
      - JwtOptions__AccessTokenLifetimeMinutes=15

      - RefreshTokenOptions__LifetimeDays=7
      - RefreshTokenOptions__TokenBytes=64

      - AuthTokenOptions__ClientId=web-client
      - AuthTokenOptions__Scopes__0=identity

      - PasswordHashOptions__Pepper=${PASSWORD_HASH_PEPPER:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      - PasswordHashOptions__WorkFactor=12

      - SuperAdminOptions__Email=${SUPERADMIN_EMAIL:-superadmin@example.com}
      - SuperAdminOptions__Password=${SUPERADMIN_PASSWORD:-admin123}
      - SuperAdminOptions__FullName=${SUPERADMIN_FULL_NAME:-Суперадминистратор}

      - MinioOptions__Endpoint=minio:9000
      - MinioOptions__AccessKey=${MINIO_ROOT_USER:-minioadmin}
      - MinioOptions__SecretKey=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MinioOptions__BucketName=${MINIO_BUCKET_NAME:-cyberbackup}
      - MinioOptions__UseSsl=false
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    restart: unless-stopped
    ports:
      - "${DEV_BIND_IP:-0.0.0.0}:${DEV_FRONTEND_PORT:-5173}:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_BASE_URL=${DEV_API_BASE_URL:-http://localhost:${DEV_BACKEND_PORT:-5000}}
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
