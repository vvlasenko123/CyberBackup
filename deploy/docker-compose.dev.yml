name: cyberbackup-dev

x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cyber-backup-api
    ports:
      - "${DEV_BIND_IP:-127.0.0.1}:${DEV_POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d cyber-backup-api" ]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    logging: *default-logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${DEV_BIND_IP:-127.0.0.1}:${DEV_MINIO_API_PORT:-19000}:9000"
      - "${DEV_BIND_IP:-127.0.0.1}:${DEV_MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: backend/Apps/CyberBackup/Api/Dockerfile
      args:
        BUILD_CONFIGURATION: ${BUILD_CONFIGURATION:-Debug}
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${DEV_BIND_IP:-127.0.0.1}:${DEV_BACKEND_PORT:-15000}:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Development
    
      - PostgresOptions__ConnectionString=Host=postgres;Port=5432;Username=postgres;Password=postgres;Database=cyber-backup-api;Pooling=true;Minimum Pool Size=0;Maximum Pool Size=100;
      - PostgresOptions__AutoMigration=true
    
      - CyberCorsOptions__Origins__0=${DEV_FRONTEND_ORIGIN:-http://localhost:${DEV_FRONTEND_PORT:-5173}}
    
      - JwtOptions__Issuer=solution
      - JwtOptions__Audience=auth-api
      - JwtOptions__SigningKey=local-dev-signing-key-change-me-please-32-bytes-minimum
      - JwtOptions__AccessTokenLifetimeMinutes=15
    
      - RefreshTokenOptions__LifetimeDays=7
      - RefreshTokenOptions__TokenBytes=64
    
      - AuthTokenOptions__ClientId=web-client
      - AuthTokenOptions__Scopes__0=identity
    
      - PasswordHashOptions__Pepper=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      - PasswordHashOptions__WorkFactor=12
    
      - SuperAdminOptions__Email=superadmin@example.com
      - SuperAdminOptions__Password=admin123
      - SuperAdminOptions__FullName=Суперадминистратор

      - MinioOptions__Endpoint=minio:9000
      - MinioOptions__AccessKey=minioadmin
      - MinioOptions__SecretKey=minioadmin
      - MinioOptions__BucketName=cyberbackup
      - MinioOptions__UseSsl=false
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${DEV_BIND_IP:-127.0.0.1}:${DEV_FRONTEND_PORT:-5173}:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_BASE_URL=${DEV_API_BASE_URL:-http://localhost:${DEV_BACKEND_PORT:-15000}}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
