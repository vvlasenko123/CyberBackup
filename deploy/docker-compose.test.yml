name: cyberbackup-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: integration-postgres
      POSTGRES_DB: cyberbackup_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d cyberbackup_test"]
      interval: 2s
      timeout: 5s
      retries: 30

  minio:
    image: chainguard/minio:latest
    user: root
    command: server /data
    environment:
      MINIO_ROOT_USER: integration-minio
      MINIO_ROOT_PASSWORD: integration-minio-password
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30

  tests:
    build:
      context: ..
      dockerfile: backend/Apps/CyberBackup/Tests/Integration.Tests/Dockerfile
    environment:
      CYBERBACKUP_TEST_PostgresOptions__ConnectionString: Host=postgres;Port=5432;Username=postgres;Password=integration-postgres;Database=cyberbackup_test
      CYBERBACKUP_TEST_PostgresOptions__AutoMigration: "true"
      CYBERBACKUP_TEST_MinioOptions__Endpoint: minio:9000
      CYBERBACKUP_TEST_MinioOptions__AccessKey: integration-minio
      CYBERBACKUP_TEST_MinioOptions__SecretKey: integration-minio-password
      CYBERBACKUP_TEST_MinioOptions__BucketName: cyberbackup-test
      CYBERBACKUP_TEST_SuperAdminOptions__Email: integration@example.com
      CYBERBACKUP_TEST_SuperAdminOptions__Password: integration-admin-password
      CYBERBACKUP_TEST_SuperAdminOptions__FullName: Integration Test Admin
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
