services:
    postgres:
        image: postgres:16-alpine
        container_name: postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: postgres
        volumes:
            - postgres_data:/var/lib/postgresql/data

    backend:
        build:
            context: ..
            dockerfile: backend/Apps/CyberBackup/Api/Dockerfile
        container_name: backend
        restart: unless-stopped
        ports:
            - "5000:8080"
        environment:
            - ASPNETCORE_URLS=http://+:8080
            - PostgresOptions__ConnectionString=Host=postgres;Port=5432;Username=postgres;Password=postgres;Database=cyber-backup-api;Pooling=true;Minimum Pool Size=0;Maximum Pool Size=100;
            - PostgresOptions__AutoMigration=true
            - CyberCorsOptions__Origins__0=http://frontend
        depends_on:
            - postgres

    frontend:
        build:
            context: ../frontend
            dockerfile: Dockerfile
        container_name: frontend
        restart: unless-stopped
        ports:
            - "80:80"
        depends_on:
            - backend

volumes:
    postgres_data: